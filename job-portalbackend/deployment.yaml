apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-portal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-portal-backend
  template:
    metadata:
      labels:
        app: job-portal-backend
    spec:
      containers:
        - name: job-portal-backend
          image: vadalijahnavi/job-portal-backend:v1.0
          ports:
            - containerPort: 5000